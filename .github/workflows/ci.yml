name: Build ONNX Runtime for OpenHarmony

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "ONNX Runtime version (e.g. 1.29.1)"
        required: false
        default: '1.29.1'
      publish_release:
        description: "Also create/publish a GitHub release"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      version:
        description: "ONNX Runtime version (empty = default)"
        type: string
        required: false
        default: ''
      publish_release:
        description: "Create a GitHub release tagged v<version> after build"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  DEFAULT_VERSION: '1.29.1'
  # OpenHarmony native SDK: openharmony-rs/ohos-sdk release tag and inner zip
  OHOS_SDK_TAG: 'v5.0.0'
  OHOS_NATIVE_ZIP: 'native-linux-x64-5.0.0.71-Release.zip'

jobs:
  build:
    name: "OHOS ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            proc: aarch64
            extra_flags: ""
          - arch: armeabi-v7a
            proc: armv7
            extra_flags: "-mfloat-abi=softfp -mfpu=neon"
          - arch: x86_64
            proc: x86_64
            extra_flags: ""

    steps:
      - name: Checkout this repository (build scripts)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install host tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf file

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            V="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          fi
          echo "version=$V" | tee -a "$GITHUB_OUTPUT"
          echo "ONNXRUNTIME_VERSION=$V" | tee -a "$GITHUB_ENV"
          echo "Building ONNX Runtime $V for ${{ matrix.arch }}"

      - name: Download OHOS SDK
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 -o ohos-sdk.tar.gz.aa \
            https://github.com/openharmony-rs/ohos-sdk/releases/download/${OHOS_SDK_TAG}/ohos-sdk-windows_linux-public.tar.gz.aa
          curl -fL --retry 3 -o ohos-sdk.tar.gz.ab \
            https://github.com/openharmony-rs/ohos-sdk/releases/download/${OHOS_SDK_TAG}/ohos-sdk-windows_linux-public.tar.gz.ab
          cat ohos-sdk.tar.gz.aa ohos-sdk.tar.gz.ab > ohos-sdk.tar.gz
          tar -xzf ohos-sdk.tar.gz
          pushd linux
          unzip -q "${OHOS_NATIVE_ZIP}"
          popd
          mkdir -p command-line-tools/sdk/default/openharmony
          mv linux/native command-line-tools/sdk/default/openharmony/native
          rm -rf linux windows ohos-sdk.tar.gz*
          echo "Cross compilers shipped by the SDK:"
          ls command-line-tools/sdk/default/openharmony/native/llvm/bin | grep 'unknown-linux-ohos-clang$'

      - name: Checkout ONNX Runtime v${{ steps.ver.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: v${{ steps.ver.outputs.version }}
          submodules: true
          path: ./onnxruntime

      - name: Patch for OHOS compatibility
        shell: bash
        run: |
          bash scripts/patch_ohos.sh \
            "${{ matrix.arch }}" \
            "$PWD/onnxruntime" \
            "$PWD/command-line-tools/sdk/default/openharmony/native"

      - name: Build onnxruntime (${{ matrix.arch }})
        shell: bash
        run: |
          set -e
          mkdir -p fc-cache
          # -j2 keeps the 7 GiB GitHub runner under its memory ceiling while linking
          bash scripts/build_ohos.sh \
            "${{ matrix.arch }}" \
            "${{ matrix.proc }}" \
            "-O3 ${{ matrix.extra_flags }} -Wno-unused-parameter -Wno-unused-command-line-argument" \
            "$PWD/onnxruntime" \
            "$PWD/command-line-tools/sdk/default/openharmony/native" \
            "$PWD/fc-cache" \
            "2"

      - name: Collect and verify artifacts
        shell: bash
        run: |
          bash scripts/collect_ohos.sh \
            "${{ matrix.arch }}" \
            "${{ steps.ver.outputs.version }}" \
            "$PWD/onnxruntime" \
            "$PWD/output"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-ohos-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: output/
          if-no-files-found: error

  publish:
    name: "Publish release v"
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'workflow_call' && inputs.publish_release)
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: onnxruntime-ohos-*
          path: dist

      - name: Package per-arch release zips
        shell: bash
        run: |
          set -e
          # download-artifact creates one directory per artifact; zip each one
          for d in dist/*/; do
            name="$(basename "$d")"
            (cd "$d" && zip -qr "../${name}.zip" .)
          done
          find dist -maxdepth 1 -name '*.zip' -exec ls -lh {} \;

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            TAG="v${INPUT_VERSION}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ONNX Runtime ${{ steps.rel.outputs.tag }} for OpenHarmony
          generate_release_notes: true
          files: |
            dist/*.zip
