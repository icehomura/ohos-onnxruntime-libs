name: Sync upstream ORT releases

# Poll microsoft/onnxruntime for new stable releases. When a new version is
# found that has not been built/published here yet, invoke the reusable build
# workflow for all three OHOS architectures and publish a matching release.
on:
  schedule:
    # every 6 hours at minute 17 (off the top of the hour to reduce congestion)
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    name: Detect new upstream release
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.detect.outputs.latest }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect latest upstream version
        id: detect
        shell: bash
        run: |
          set -e
          latest=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/microsoft/onnxruntime/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "Upstream latest stable release: v$latest"

          # Only accept plain X.Y.Z stable versions (skip -rc, dev, etc.)
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable release tag, skipping: $latest"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "latest=$latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Already published in this repository?
          if git ls-remote --tags --exit-code origin "refs/tags/v$latest" >/dev/null 2>&1; then
            echo "v$latest already published here, nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$latest detected; triggering build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  build:
    name: Build newly detected release
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.check.outputs.latest }}
      publish_release: true
    permissions:
      contents: write
